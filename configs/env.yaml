# Simulator: reward shaping, candidate truncation and fluid guidance.
env:
  discard_penalty: 1.0        # reward penalty per discarded order (normalised by the order count)
  progress_reward_coeff: 0.0  # optional progress term on the change of the fulfilment rate; 0 disables it
  order_top_k: 5              # most urgent waiting orders kept per operation type (EDD order)
  fluid_mode: cached_lp       # cached_lp (Gurobi LP with heuristic fallback) | heuristic | off (zero fluid features)
  fluid_time_limit: 2         # Gurobi time limit in seconds (0 = unlimited)
  fluid_threads: 0            # Gurobi thread count (0 = solver default)
  collector_workers: 0        # 0 = simulators in the trainer process (original path); N > 0 = N worker processes step the
                              # environments and build the observations while the policy stays in the trainer; numerically
                              # identical (tests/test_collector.py, python -m tests.equivalence --collector-workers 3);
                              # measure with tools/profile_collector.py before enabling (see README section 2)
  collector_start_method: spawn   # spawn (default, Windows-safe) | fork | forkserver; spawn is forced when CUDA is used
